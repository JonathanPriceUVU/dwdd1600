<!doctype html>
<html lang="en">
<head>
    <meta name="description" content="Get your next meal delivered by drone.">
    
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@200;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="delivery.css">
    
    <meta charset="UTF-8">
    <title>Drone Delivery Services LLC.</title>

</head>
<body>
    <!-- start the page header -->
    <header>
        <span>Drone Delivery </span>
    </header>
    
    <!-- start the page navigation -->
    <nav>
        <ul>
            <li><a href="index.html">About Us</a></li>
            <li class="active"><a href="request.html">Request a Delivery</a></li>
            <li><a href="#">Contact Us</a></li>
        </ul>
    </nav>
    
    <!-- start the page main -->
    <main>
        <h1>Request a Delivery</h1>
        <form action="thanks.html" method="get" class="bobby" >
            <fieldset>
                <legend> Personal information</legend>
                <label> First Name: <input type="text" name="fname" required></label>
                <label> Last Name: <input type="text" name="lname" required></label>
                <label> Phone: <input type="tel" name="phone" required placeholder="000-000-0000"></label>
                <label> Email: <input type="email" required></label>
            </fieldset>

            <fieldset>
                <legend>Delivery Method</legend>
                <label><input type="radio" name="method" value="drone"> Drone, Delivery (4hrs)</label>
                <label><input type="radio" name="method" value="truck"> Truck, Delivery (72hrs)</label>
                <label><input type="radio" name="method" value="airplane"> Airplane, Delivery (24hr)</label>
            </fieldset>
            
            <fieldset>
                <legend>Delivery Options</legend>
                <label><input type="checkbox" name="Porch" value="choosen"> Front Porch</label>
                <label><input type="checkbox" name="Door" value="choosen"> Front Door</label>
                <label><input type="checkbox" name="Garage" value="choosen"> Garage</label>
                <label><input type="checkbox" name="Doorman" value="choosen"> Other</label>
                
                <label>Preferred Delivery Time:
                <select name="time">
                    <option value="none">Please select a time</option>
                    <option value="morning">Morning (8am - 12pm)</option>
                    <option value="afternoon">Afternoon (12pm - 5pm)</option>
                    <option value="evening">Evening (5pm - 9pm)</option>
                    <option value="night">Night (9pm - 12am)</option>
                </select></label>
            </fieldset>

            <label>Comments:
                <textarea name="comments">Please add any special instructions for your delivery.

                </textarea>

            </textarea></label>

        





        <input type="submit" value="Enter Data to Our System">
        </form>
    </main>
    
    <!-- start the page footer -->
    <footer>
        <p>&copy;202X &bull; Drone Delivery Services &bull; <a href="mailto:zen@gmail.com">Email Us</a> </p>
    </footer>
</body>
</html>
